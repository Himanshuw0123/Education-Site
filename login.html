<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: {
    display: ['Fraunces','serif'], body: ['Inter','sans-serif'], mono: ['IBM Plex Mono','monospace'] },
    colors: { paper:'#F6F4EE', ink:'#1B2B26', pine:'#233C34', trail:'#3B6E64', amber:'#C77D3B', stone:'#8A8578', night:'#0F1815', nightcard:'#182420' } } } }
</script>
<style>
  body { background:#F6F4EE; }
  html.dark body { background:#0F1815; }
  .contour-bg {
    background-image: repeating-radial-gradient(circle at 20% 30%, transparent 0, transparent 38px, rgba(59,110,100,0.08) 39px, rgba(59,110,100,0.08) 40px, transparent 41px);
  }
  html.dark .contour-bg {
    background-image: repeating-radial-gradient(circle at 20% 30%, transparent 0, transparent 38px, rgba(59,110,100,0.15) 39px, rgba(59,110,100,0.15) 40px, transparent 41px);
  }
  :focus-visible { outline: 2px solid #C77D3B; outline-offset: 2px; }
</style>
</head>
<body class="font-body text-ink dark:text-[#EDEAE1] antialiased">

<div class="min-h-screen grid lg:grid-cols-2">
  <!-- Left: form -->
  <div class="flex flex-col justify-center px-8 sm:px-16 lg:px-20 py-16">
    <a href="index.html" class="flex items-center gap-2 mb-12">
      <svg width="24" height="24" viewBox="0 0 26 26" fill="none"><path d="M2 20 C7 20 8 8 13 8 C18 8 19 20 24 20" stroke="#C77D3B" stroke-width="2" stroke-linecap="round"/><circle cx="13" cy="8" r="2.5" fill="#3B6E64"/></svg>
      <span class="font-display text-xl font-semibold">Meridian</span>
    </a>

    <h1 class="font-display text-3xl font-semibold mb-2">Welcome back</h1>
    <p class="text-sm text-ink/60 dark:text-white/60 mb-8">Pick up right where you left the trail.</p>

    <button class="w-full flex items-center justify-center gap-3 border border-ink/15 dark:border-white/20 rounded-full py-3 text-sm font-medium hover:bg-ink/5 dark:hover:bg-white/5 transition mb-6">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 013.68 9c0-.6.1-1.18.29-1.72V4.95H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.05l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.98 4.95l2.99 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="flex items-center gap-3 mb-6">
      <div class="h-px flex-1 bg-ink/10 dark:bg-white/10"></div>
      <span class="text-xs font-mono text-ink/40 dark:text-white/40">OR</span>
      <div class="h-px flex-1 bg-ink/10 dark:bg-white/10"></div>
    </div>

    <form class="space-y-4">
      <div>
        <label class="text-xs font-mono uppercase text-ink/50 dark:text-white/50">Email</label>
        <input type="email" placeholder="you@example.com" class="mt-1.5 w-full rounded-lg border border-ink/15 dark:border-white/15 bg-white dark:bg-nightcard px-4 py-3 text-sm outline-none focus:border-trail dark:focus:border-[#8FC4B4] transition"/>
      </div>
      <div>
        <div class="flex items-center justify-between">
          <label class="text-xs font-mono uppercase text-ink/50 dark:text-white/50">Password</label>
          <a href="#" class="text-xs text-trail dark:text-[#8FC4B4] hover:underline">Forgot?</a>
        </div>
        <input type="password" placeholder="••••••••" class="mt-1.5 w-full rounded-lg border border-ink/15 dark:border-white/15 bg-white dark:bg-nightcard px-4 py-3 text-sm outline-none focus:border-trail dark:focus:border-[#8FC4B4] transition"/>
      </div>
      <button type="submit" class="w-full py-3 rounded-full bg-pine dark:bg-trail text-paper text-sm font-semibold hover:opacity-90 transition">Sign in</button>
    </form>

    <p class="text-sm text-ink/60 dark:text-white/60 mt-8">
      New to Meridian? <a href="signup.html" class="text-trail dark:text-[#8FC4B4] font-medium hover:underline">Create an account</a>
    </p>
  </div>

  <!-- Right: visual -->
  <div class="hidden lg:flex contour-bg bg-pine dark:bg-nightcard items-center justify-center relative overflow-hidden">
    <svg viewBox="0 0 400 400" class="w-3/4">
      <path d="M40,340 C110,340 120,220 200,220 C280,220 290,320 360,320" fill="none" stroke="#C77D3B" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
      <circle cx="40" cy="340" r="6" fill="#F6F4EE"/>
      <circle cx="360" cy="320" r="6" fill="#C77D3B"/>
      <circle cx="200" cy="220" r="4" fill="#F6F4EE" opacity="0.6"/>
    </svg>
    <div class="absolute bottom-12 left-12 right-12 text-paper">
      <p class="font-display text-2xl leading-snug">"I stopped watching tutorials and started finishing them."</p>
      <p class="text-xs font-mono text-white/50 mt-4">— Alicia M., Data Analyst</p>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem('meridian-theme') === 'dark') document.documentElement.classList.add('dark');
</script>
</body>
</html>
